# Render Blueprint for the Resolve API (Express + MongoDB + socket.io).
# Deploy: Render Dashboard -> New -> Blueprint -> point at this repo.
# Secrets (sync: false) are NOT stored here — Render prompts for them on first
# deploy. Fill them from your local .env. Never commit real secret values.
services:
  - type: web
    name: resolve-api
    runtime: node
    plan: free # Sleeps after 15 min idle; keep-alive via cron-job.org (see below).
    region: frankfurt # Closest Render EU region to MongoDB Atlas (Ireland / eu-west-1) and S3 (eu-north-1).
    branch: main
    healthCheckPath: /health
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      # PORT is injected by Render automatically — do NOT set it here.
      - key: NODE_ENV
        value: production
      - key: CUSTOM_DNS
        value: "false"

      # ── Database ──────────────────────────────────────────────
      - key: MONGODB_URI
        sync: false

      # ── AWS S3 (media uploads) ────────────────────────────────
      - key: AWS_REGION
        value: eu-north-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_PUBLIC_BASE_URL
        value: https://resolve-webapp-media.s3.eu-north-1.amazonaws.com
      - key: SHORTS_MAX_UPLOAD_MB
        value: "100"
      - key: SHORTS_MAX_THUMBNAIL_MB
        value: "10"

      # ── Clerk auth ────────────────────────────────────────────
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_WEBHOOK_SIGNING_SECRET
        sync: false
      - key: SUPER_ADMIN_USER_ID
        sync: false
      # Production frontend origin (drives CORS + socket.io allowlist).
      - key: FRONTEND_ORIGIN
        value: https://resolve-webapp.vercel.app

      # ── AI Chat (Claude) ──────────────────────────────────────
      # Either key name works; ANTHROPIC_API_KEY is the SDK's own convention.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_CHAT_MODEL_VELO
        value: claude-haiku-4-5
      - key: ANTHROPIC_CHAT_MODEL_CORE
        value: claude-sonnet-5
      - key: ANTHROPIC_CHAT_MODEL_MAX
        value: claude-opus-4-8
      # Caps thinking AND response text together — see .env.example.
      - key: ANTHROPIC_MAX_TOKENS_VELO
        value: "4096"
      - key: ANTHROPIC_MAX_TOKENS_CORE
        value: "16000"
      - key: ANTHROPIC_MAX_TOKENS_MAX
        value: "24000"
      - key: WEB_SEARCH_MAX_USES
        value: "5"
      # One-shot models for the non-chat generation jobs (Brief, AI Summary).
      - key: ANTHROPIC_SUMMARY_MODEL
        value: claude-sonnet-5
      - key: ANTHROPIC_BRIEF_MODEL
        value: claude-sonnet-5

      # ── Gemini ────────────────────────────────────────────────
      # No Gemini remains on any request path — generation is Claude, retrieval is
      # Voyage, and lib/gemini.ts was deleted in the Phase 3 teardown. These three
      # are read only by scripts/migrateChatMessageModel.ts, which maps legacy
      # ChatMessage.model values back to a Resolve key. That migration has already
      # run and the script carries the same defaults, so they can go once you are
      # confident no unmigrated rows remain. GEMINI_API_KEY is gone — revoke the
      # key in Google Cloud if nothing else uses it.
      - key: GEMINI_CHAT_MODEL
        value: gemini-flash-latest
      - key: GEMINI_CHAT_MODEL_THINKING
        value: gemini-2.5-flash
      - key: GEMINI_CHAT_MODEL_PRO
        value: gemini-2.5-pro

      # ── Embeddings (Voyage) ───────────────────────────────────
      # Anthropic ships no embeddings endpoint. Runs alongside Gemini during the
      # Phase 2 dual-index cutover; Gemini serves reads until the flip.
      - key: VOYAGE_API_KEY
        sync: false
      - key: VOYAGE_EMBED_MODEL
        value: voyage-4
      - key: VOYAGE_EMBED_DIM
        value: "1024"

      # ── Resolve Brief ─────────────────────────────────────────
      # Output ceiling for one brief. Hitting it fails the draft with
      # `brief_truncated` rather than storing half a brief.
      - key: ANTHROPIC_BRIEF_MAX_TOKENS
        value: "8000"
      # Shared Bearer token guarding POST /api/cron/resolve-brief (Brief generation).
      # Invent a long random string; the scheduler that calls that endpoint must
      # send `Authorization: Bearer <this value>`. Code reads process.env.CRON_SECRET.
      - key: CRON_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESOLVE_BRIEF_EMAIL_FROM
        sync: false
      # Absolute links inside Brief emails point at the production frontend.
      - key: RESOLVE_APP_URL
        value: https://resolve-webapp.vercel.app
      - key: RESOLVE_BRIEF_EMAIL_BATCH_SIZE
        value: "10"

      # ── Research Requests: email ──────────────────────────────
      - key: RESEARCH_REQUESTS_EMAIL_FROM
        value: editorial@resolve.pk
      - key: RESEARCH_REQUESTS_EMAIL_REPLY_TO
        value: editor@resolve.pk
      - key: RESEARCH_REQUESTS_FANOUT_CONCURRENCY
        value: "50"
      - key: RESEARCH_REQUESTS_FANOUT_SYNC_THRESHOLD
        value: "1000"
